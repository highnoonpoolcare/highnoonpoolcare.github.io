site:
  name: High Noon Pool Care
  site: 'https://www.highnoonpoolcare.com'
  base: '/'
  trailingSlash: false

# Default SEO metadata
metadata:
  title:
    default: High Noon Pool Care
    template: '%s — High Noon Pool Care'
  description: 'High Noon Pool Care provides professional weekly pool service, cleaning, chemical balancing, and maintenance in Corinth, Denton, Lewisville, and surrounding areas. Get a free quote today.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: High Noon Pool Care
    images:
      - url: '~/assets/images/high-noon-pool-care-logo.jpeg'
        width: 1200
        height: 628
    type: website
  twitter:
    cardType: summary

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/blog/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        # Tag archives are thin and near-duplicate; keep them crawlable but
        # out of the index so they don't compete with posts and city pages.
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 3

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'light:only'
